apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: dogs
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dogs
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: dogs:latest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
