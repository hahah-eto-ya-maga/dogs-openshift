apiVersion: v1
kind: ConfigMap
metadata:
  name: dogs-config
data:
  DB_HOST: db
  DB_NAME: dogs
  DB_USER: dogs
  APP_VERSION: '1.0'
  WELCOME_MESSAGE: 'Каждой собаке нужен дом — OpenShift'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dogs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dogs-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dogs-observer
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dogs-observer
subjects:
  - kind: ServiceAccount
    name: dogs-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dogs-observer
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector:
    app: dogs-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: dogs-db
  template:
    metadata:
      labels:
        app: dogs-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: dogs
            - name: POSTGRESQL_DATABASE
              value: dogs
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dogs-secret
                  key: DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -p 5432']
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
