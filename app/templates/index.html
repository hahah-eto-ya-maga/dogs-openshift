<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Добрые лапы · OpenShift Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#19392e;background:#f4f6ef}body{margin:0}main{max-width:1080px;margin:auto;padding:32px 20px}header{border-bottom:1px solid #ccd6c6;padding-bottom:24px}small{letter-spacing:2px;color:#53715d}h1{font-size:clamp(32px,6vw,58px);margin:16px 0}h2{font-size:24px}p{line-height:1.6}#info{font-family:monospace;font-size:13px}section{margin-top:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card,form{background:white;border:1px solid #d9dfd2;border-radius:16px;padding:22px}.card h3{font-size:24px;margin:12px 0}.badge{display:inline-block;border-radius:20px;padding:5px 10px;background:#e8efcf;font-size:12px}button{border:0;background:#254e39;color:white;cursor:pointer;padding:12px 18px;border-radius:8px}button:disabled{opacity:.5;cursor:default}input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #b8c8ba;border-radius:7px;margin:6px 0 16px;background:white}label{font-size:14px}#error{color:#a11d20;white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #d9dfd2}a{color:#254e39}footer{margin-top:40px;color:#53715d;font-size:13px}
</style>
<main><header><small>OPENSHIFT LAB / 01</small><h1>Каждой собаке нужен дом 🐾</h1><p>Учебный приют. Добавляй собак, знакомься с ними и находи им семью.</p><div id="info"></div></header>
<p id="error" role="alert"></p><button id="refresh">Обновить данные</button>
<section><h2>Наши хвосты <span id="count"></span></h2><div id="dogs" class="grid"></div></section>
<section class="grid"><form id="dog-form"><h2>Добавить собаку</h2><label>Кличка<input name="name" required maxlength="120"></label><label>Возраст, лет<input name="age" type="number" min="0" max="30" value="1" required></label><label>Порода<select name="breed_id" id="breed" required></select></label><label>Приют<select name="shelter_id" id="shelter" required></select></label><button>Добавить</button></form>
<form id="breed-form"><h2>Новая порода</h2><label>Название<input name="name" required maxlength="120"></label><button>Сохранить</button></form>
<form id="shelter-form"><h2>Новый приют</h2><label>Название<input name="name" required maxlength="120"></label><label>Город<input name="city" required maxlength="120"></label><button>Сохранить</button></form></section>
<section><h2>Нашли семью</h2><div style="overflow:auto"><table><thead><tr><th>Собака</th><th>Хозяин</th><th>Дата</th></tr></thead><tbody id="adoptions"></tbody></table></div></section>
<footer>Демо без авторизации: используй вымышленные имена. API: <a href="/api/dogs">/api/dogs</a> · <a href="/readyz">готовность</a> · <a href="/api/info">pod</a></footer></main>
<script>
const $=s=>document.querySelector(s);
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===204)return;const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d;}
function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
async function refresh(){try{$('#error').textContent='';const [dogs,breeds,shelters,adoptions,info]=await Promise.all(['dogs','breeds','shelters','adoptions','info'].map(x=>api('/api/'+x)));$('#info').textContent=`${info.message} · pod: ${info.pod} · v${info.version}`;$('#count').textContent=`(${dogs.length})`;for(const [selector,items] of [['#breed',breeds],['#shelter',shelters]]){$(selector).replaceChildren(...items.map(x=>{const o=element('option',x.name);o.value=x.id;return o;}));}$('#dogs').replaceChildren(...dogs.map(d=>{const card=element('article','');card.className='card';const badge=element('span',d.status==='available'?'Ищет дом':'Уже дома');badge.className='badge';card.append(badge,element('h3',d.name),element('p',`${breeds.find(b=>b.id===d.breed_id)?.name} · ${d.age} лет`),element('p',shelters.find(s=>s.id===d.shelter_id)?.name));const button=element('button','Забрать домой');button.disabled=d.status!=='available';button.onclick=async()=>{const applicant=prompt('Имя будущего хозяина (для демо — вымышленное):');if(!applicant)return;try{await api('/api/adoptions','POST',{dog_id:d.id,applicant});await refresh();}catch(e){$('#error').textContent=e.message;}};card.append(button);return card;}));$('#adoptions').replaceChildren(...adoptions.map(a=>{const row=element('tr','');row.append(element('td',dogs.find(d=>d.id===a.dog_id)?.name||a.dog_id),element('td',a.applicant),element('td',new Date(a.created_at).toLocaleDateString('ru')));return row;}));}catch(e){$('#error').textContent=e.message;}}
for(const [id,path] of [['dog','dogs'],['breed','breeds'],['shelter','shelters']]){$(`#${id}-form`).onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(id==='dog')for(const k of ['age','breed_id','shelter_id'])data[k]=Number(data[k]);try{await api('/api/'+path,'POST',data);e.target.reset();await refresh();}catch(err){$('#error').textContent=err.message;}};}
$('#refresh').onclick=refresh;refresh();
</script></html>
